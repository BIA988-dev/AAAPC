name: Windows Cloud PC - Anydesk (Optimized)
on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Send Start Alert to Discord
        run: |
          $url = "https://discord.com/api/webhooks/1559692401885323404/vB34axtoDHT5VrlCmIRG6cmeKD9rZ7v87VyPnTvAn5CadByWwLdqDY3cF6rDUFT9ioMT"
          $body = @{ content = "🚀 **Start:** O GitHub Actions iniciou a criação do seu Cloud PC Windows!" } | ConvertTo-Json
          Invoke-RestMethod -Uri $url -Method Post -Body$body -ContentType "application/json"

      - name: Downloading & Installing Essentials
        run: |
          Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "AnyDesk.exe"
          Start-Process -FilePath "AnyDesk.exe" -ArgumentList "--install `"$env:ProgramFiles (x86)\AnyDesk`" --start-with-win --silent" -Wait
          Start-Sleep -Seconds 5

      - name: Configure Password & Notify Discord
        run: |
          $anydeskPath = "${env:ProgramFiles(x86)}\AnyDesk\AnyDesk.exe"
          cmd.exe /c "echo Senha123456| `"$anydeskPath`" --set-password"
          
          # Inicia o serviço do AnyDesk explicitamente
          Start-Process -FilePath $anydeskPath
          Start-Sleep -Seconds 5

          # Tenta obter o ID de forma segura (se falhar por algum motivo de ambiente, não crasha o workflow)
          try {
            $anydeskId = (&$anydeskPath --get-id)
            if (-not $anydeskId) {$anydeskId = "Verificar no Log (Indisponível via CLI)" }
          } catch {
            $anydeskId = "Erro ao recuperar ID automaticamente"
          }

          # Envia para o Discord
          $url = "https://discord.com/api/webhooks/1559692401885323404/vB34axtoDHT5VrlCmIRG6cmeKD9rZ7v87VyPnTvAn5CadByWwLdqDY3cF6rDUFT9ioMT"
          $text = "🖥️ **Cloud PC Pronto!**`n🔹 **ID AnyDesk:** $anydeskId`n🔑 **Senha:** Senha123456"
          $body = @{ content =$text } | ConvertTo-Json
          
          Invoke-RestMethod -Uri $url -Method Post -Body$body -ContentType "application/json"
          Write-Host "Configuração concluída e notificação enviada!"

      - name: Keep Runner Alive
        run: |
          Write-Host "Sessão iniciada e ativa."
          for ($i = 1; $i -le 360; $i++) {
            Write-Host "[Ativo] Minuto $i de 360..."
            Start-Sleep -Seconds 60
          }

      - name: Clean Up Temporary Files
        if: always()
        run: |
          Remove-Item AnyDesk.exe -ErrorAction SilentlyContinue -Force
          Write-Host "Limpeza concluída."
